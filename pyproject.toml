[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanobo"
version = "0.2.4"
description = "Local, native desktop experiment planning for chemists"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
nanobo = "chembo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
