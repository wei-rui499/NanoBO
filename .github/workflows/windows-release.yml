name: Windows installer from tested runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthbo-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  build:
    name: Preserve tested runtime and package bilingual interface
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
          architecture: x64
      - name: Read shared application version
        id: version
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = python -c "import sys; sys.path.insert(0, 'src'); from chembo import __version__; print(__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Obtain exact published Windows baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          gh release download v0.2.4 --repo '${{ github.repository }}' --pattern '*windows*' --dir baseline
          python -m pip install PyInstaller==6.16.0
      - name: Update UI only and verify scientific runtime preservation
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/repack_windows_ui.py --base baseline/NanoBO-0.2.4-windows-x64-portable-unsigned.zip --base-source baseline/NanoBO-0.2.4-windows-source.zip --output dist
          @'
          import hashlib, pathlib, zipfile
          path=pathlib.Path('baseline/NanoBO-0.2.4-windows-library-sources.zip')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == 'c3e6893ec88ed065e5f7938876eb04c5255a7efcd85638c245b615f75d85d2c7'
          with zipfile.ZipFile(path) as archive:
              archive.extractall('release')
          '@ | python -
      - name: Build installer, portable ZIP and corresponding sources
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'inno-7.1.1'
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $compilerSetup
          if ((Get-FileHash $compilerSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw 'Official compiler checksum mismatch' }
          $compilerInstall = Start-Process $compilerSetup -ArgumentList @('/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/NOICONS',('/DIR="'+$compilerRoot+'"')) -WindowStyle Hidden -Wait -PassThru
          if ($compilerInstall.ExitCode -ne 0) { throw 'Inno Setup 7 installation failed' }
          $compiler = Join-Path $compilerRoot 'ISCC.exe'
          python scripts/package_windows.py --compiler "$compiler"
      - name: Record verification boundary
        run: |
          @'
          ## Windows interface update over the user-tested baseline
          The published 0.2.4 portable ZIP was verified by SHA-256. Only interface,
          version, verification and documentation resources were replaced. All other
          frozen modules, native libraries and the complete modern worker were checked
          byte for byte against that baseline. Full details are in WINDOWS_BUILD JSON.
          The new application and installer were not executed on Windows, as requested.
          The user will validate the bilingual interface on Windows. Packages are unsigned.
          '@ >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: SynthBO-${{ steps.version.outputs.version }}-windows-x64-package
          path: installers/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Attach Windows files to draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_VERSION: ${{ needs.build.outputs.version }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: SynthBO-${{ needs.build.outputs.version }}-windows-x64-package
          path: installers
      - name: Create or reuse matching draft without publishing it
        shell: bash
        run: |
          set -euo pipefail
          tag="v${BUILD_VERSION}"
          if gh release view "$tag" --json isDraft,targetCommitish > release.json 2>/dev/null; then
            test "$(jq -r .isDraft release.json)" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
            if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" > tag.json 2>/dev/null; then
              type="$(jq -r .object.type tag.json)"
              object="$(jq -r .object.sha tag.json)"
              if [ "$type" = tag ]; then object="$(gh api "repos/${GH_REPO}/git/tags/${object}" --jq .object.sha)"; fi
              test "$object" = "$BUILD_SHA" || { echo 'Release tag is not the built commit'; exit 1; }
            elif [ "$(jq -r .targetCommitish release.json)" != "$BUILD_SHA" ]; then
              gh release edit "$tag" --target "$BUILD_SHA"
            fi
          else
            cat > notes.md <<'NOTES'
          SynthBO with a Chinese / English interface switch, offline tutorials and practice data.

          Windows uses the exact scientific runtime from the published 0.2.4 package reported working by the user. Unchanged modules and runtime files are verified against that baseline. The updated interface and installer have not been run on Windows; see WINDOWS_BUILD JSON. Packages are unsigned.

          Scientific authors, licenses and citation instructions are retained in ACKNOWLEDGMENTS.md, THIRD_PARTY_NOTICES.md and REFERENCES.bib.
          NOTES
            gh release create "$tag" --target "$BUILD_SHA" --draft --prerelease --title "SynthBO ${BUILD_VERSION}" --notes-file notes.md
          fi
          gh release upload "$tag" installers/* --clobber
